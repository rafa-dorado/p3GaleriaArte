    --bg-panel:#0d1420;
    --bg-panel-2:#111a29;
    --line-blue:rgba(96,148,255,0.14);
    --line-blue-strong:rgba(130,178,255,0.4);

    --ocre:#bb7c3d;

    --anil:#4a6aa5;
    --carmin-border:#9a4a56;
    --carmin-text:#e2929c;
    --verde-oxido:#4f7a5c;
    --text-main:#eef2fa;
    --text-dim:#b7c2d9;
    --ok:#6fbb8a;
    --font-sans:'IBM Plex Sans', system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;

    --fs-body:18px;
    --fs-body-lg:20px;
    --fs-label:22px;

    --text-main:#ffffff;

<script type="text/plain" id="app-source">
/* ============================================================================
   SALA 1 — ANATOMÍA DEL LIENZO (Pigmento Ocre)
   "La Galería en Blanco" · Eonesia v15.1 · Pantalla independiente
   ---------------------------------------------------------------------------
   REVISIÓN DE ACCESIBILIDAD (esta versión corrige):
   1) Escala tipográfica: cuerpo >=18px (--fs-body), rótulos de sistema >=22px
      (--fs-label); nada por debajo de esos mínimos en ningún texto funcional.
   2) Crédito de cada obra SIEMPRE como texto visible en pantalla (no solo en
      el atributo title=, que no existe en tablet sin ratón).
   3) :focus-visible en todo elemento interactivo + bidones y fragmentos son
      ahora foco/teclado-operables (tabIndex, role="button", Enter/Espacio).
   4) El contador de cada bidón es un dato funcional: usa texto principal de
      cuerpo (18px, --text-main/--gold), no el tono decorativo tenue.
   Además: toggle de "alto contraste" en el header (tema con negro puro,
   blanco puro y acentos más saturados) para necesidades de contraste altas.
   ---------------------------------------------------------------------------
   NOTA DE IMPLEMENTACIÓN SOBRE LOS FRAGMENTOS (transparencia técnica, ya
   señalada en la iteración anterior): el superprompt pide imágenes reales
   embebidas en base64. Este entorno de construcción no tiene acceso de red
   para descargar y codificar binarios, así que los fragmentos usan obras
   reales de dominio público alojadas en Wikimedia Commons (Special:FilePath,
   enlace estable por nombre de archivo) recortadas visualmente con
   background-size/background-position — nunca iconos genéricos. Si el
   paquete final necesita ser 100% offline, basta sustituir esas URLs por los
   mismos archivos ya descargados en base64.
   ========================================================================= */

const { useState, useRef, useEffect, useCallback, useMemo } = React;

/* ---------------------------------------------------------------------- */
/* 0. DATOS: categorías, fragmentos reales, textos de sistema             */
/* ---------------------------------------------------------------------- */

const CATEGORIES = {
  punto:   { label: 'Punto',   desc: 'Marca mínima, sin dirección definida.' },
  linea:   { label: 'Línea',   desc: 'Recorrido con dirección; puede ser recta, curva o quebrada.' },
  plano:   { label: 'Plano',   desc: 'Superficie delimitada, sin sugerencia de profundidad.' },
  textura: { label: 'Textura', desc: 'Sugiere una superficie táctil (rugosa, lisa, granulada) mediante técnica pictórica.' },
  volumen: { label: 'Volumen', desc: 'Sugiere profundidad tridimensional mediante luz y sombra (degradado).' },
};
const CATEGORY_ORDER_DEFAULT = ['punto', 'linea', 'plano', 'textura', 'volumen'];

const IMG_VANGOGH    = 'https://commons.wikimedia.org/wiki/Special:FilePath/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg?width=1200';
const IMG_SEURAT     = 'https://commons.wikimedia.org/wiki/Special:FilePath/Georges_Seurat_-_A_Sunday_on_La_Grande_Jatte_--_1884_-_Google_Art_Project.jpg?width=1200';
const IMG_SEURAT_TILE= 'https://commons.wikimedia.org/wiki/Special:FilePath/Georges_Seurat_-_A_Sunday_on_La_Grande_Jatte_--_1884_-_Google_Art_Project-x0-y2.jpg?width=800';
const IMG_KANDINSKY  = 'https://commons.wikimedia.org/wiki/Special:FilePath/Black_Lines_by_Vasily_Kandinsky,_1913.JPG?width=1200';
const IMG_MONDRIAN   = 'https://commons.wikimedia.org/wiki/Special:FilePath/Piet_Mondriaan,_1930_-_Mondrian_Composition_II_in_Red,_Blue,_and_Yellow.jpg?width=1200';
const IMG_MALEVICH   = 'https://commons.wikimedia.org/wiki/Special:FilePath/Black_square.jpg?width=900';
const IMG_VERMEER    = 'https://commons.wikimedia.org/wiki/Special:FilePath/Girl_with_a_Pearl_Earring.jpg?width=1200';
const IMG_REMBRANDT  = 'https://commons.wikimedia.org/wiki/Special:FilePath/Rembrant_Self-Portrait,_1660.jpg?width=1200';

const CREDITS = {
  [IMG_VANGOGH]:   'V. van Gogh — La noche estrellada (1889). Dominio público, Wikimedia Commons.',
  [IMG_SEURAT]:    'G. Seurat — Tarde de domingo en la Grande Jatte (1884). Dominio público, Wikimedia Commons.',
  [IMG_SEURAT_TILE]:'G. Seurat — Tarde de domingo en la Grande Jatte, detalle (1884). Dominio público, Wikimedia Commons.',
  [IMG_KANDINSKY]: 'V. Kandinsky — Líneas negras (1913). Dominio público, Wikimedia Commons.',
  [IMG_MONDRIAN]:  'P. Mondrian — Composición II en rojo, azul y amarillo (1930). Dominio público, Wikimedia Commons.',
  [IMG_MALEVICH]:  'K. Malévich — Cuadrado negro (1915). Dominio público, Wikimedia Commons.',
  [IMG_VERMEER]:   'J. Vermeer — La joven de la perla (h. 1665). Dominio público, Wikimedia Commons.',
  [IMG_REMBRANDT]: 'Rembrandt van Rijn — Autorretrato (1660). Dominio público, Wikimedia Commons.',
};

// 15 fragmentos: 3 por categoría. bgSize/bgPos crean el "recorte" del fragmento
// real sobre la obra completa (misma técnica que un visor de detalle de museo).
const FRAGMENTS = [
  { id: 'f01', categoria: 'punto', src: IMG_SEURAT, bgSize: '520% auto', bgPos: '36% 58%' },
  { id: 'f02', categoria: 'punto', src: IMG_SEURAT, bgSize: '560% auto', bgPos: '64% 28%' },
  { id: 'f03', categoria: 'punto', src: IMG_SEURAT_TILE, bgSize: '150% auto', bgPos: '50% 45%' },
  { id: 'f04', categoria: 'linea', src: IMG_KANDINSKY, bgSize: '320% auto', bgPos: '22% 18%' },
  { id: 'f05', categoria: 'linea', src: IMG_KANDINSKY, bgSize: '300% auto', bgPos: '72% 66%' },
  { id: 'f06', categoria: 'linea', src: IMG_KANDINSKY, bgSize: '340% auto', bgPos: '48% 82%' },
  { id: 'f07', categoria: 'plano', src: IMG_MONDRIAN, bgSize: '260% auto', bgPos: '28% 24%' },
  { id: 'f08', categoria: 'plano', src: IMG_MONDRIAN, bgSize: '260% auto', bgPos: '76% 72%' },
  { id: 'f09', categoria: 'plano', src: IMG_MALEVICH, bgSize: '175% auto', bgPos: '50% 50%' },
  { id: 'f10', categoria: 'textura', src: IMG_VANGOGH, bgSize: '430% auto', bgPos: '28% 18%' },
  { id: 'f11', categoria: 'textura', src: IMG_VANGOGH, bgSize: '430% auto', bgPos: '72% 76%' },
  { id: 'f12', categoria: 'textura', src: IMG_VANGOGH, bgSize: '460% auto', bgPos: '50% 46%' },
  { id: 'f13', categoria: 'volumen', src: IMG_VERMEER, bgSize: '260% auto', bgPos: '44% 34%' },
  { id: 'f14', categoria: 'volumen', src: IMG_VERMEER, bgSize: '300% auto', bgPos: '60% 56%' },
  { id: 'f15', categoria: 'volumen', src: IMG_REMBRANDT, bgSize: '250% auto', bgPos: '40% 28%' },
].map(f => ({ ...f, credit: CREDITS[f.src] }));

// Fragmento ambiguo de la Fase 3 (impasto + claroscuro: textura Y volumen a la vez)
const AMBIGUOUS_FRAGMENT = {
  id: 'amb01', src: IMG_REMBRANDT, bgSize: '430% auto', bgPos: '55% 20%', credit: CREDITS[IMG_REMBRANDT],
};

const SYS_TITLE = 'SALA 1 — ANATOMÍA DEL LIENZO';
const SYS_INTRO = 'Pigmento OCRE drenado. Clasificad los fragmentos por elemento visual para iniciar la recuperación.';
const ANOMALY_TEXT = 'NOTA TÉCNICA: composición pigmentaria del fragmento incompatible con la fecha catalogada de la obra de origen. Anomalía registrada — sin resolver.';

const HINTS = {
  planoVolumen: 'El volumen se sugiere con degradado de luz; el plano es una superficie sin profundidad. Buscad la sombra.',
  porTema: 'No preguntéis qué representa el fragmento. Preguntad cómo está construido visualmente.',
  binRotado: 'Los bidones han cambiado de sitio. Leed la etiqueta, no la posición de memoria.',
  encargoUnaCategoria: 'El encargo pide dos elementos distintos combinados. Revisad qué categorías tenéis en el lienzo.',
  encargoAmontonado: 'Un restaurador también compone con intención. Dejad que cada fragmento respire en el lienzo.',
};

/* ---------------------------------------------------------------------- */
/* 1. UTILIDADES: estado por URL, motion, easing, sonido                  */
/* ---------------------------------------------------------------------- */

function encodeState(obj) {
  try { return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }
  catch (e) { return ''; }
}
function decodeState(str) {
  try { return JSON.parse(decodeURIComponent(escape(atob(str)))); }
  catch (e) { return null; }
}
function readInitialState() {
  const params = new URLSearchParams(window.location.search);
  const raw = params.get('state');
  const fallback = {
    equipo: 'Equipo sin asignar',
    registros_p3: { clasificacion: [], encargo_satisfecho: false, nota_criterio: '' },
    anomalia_p3: false,
    ayudas_usadas: 0,
  };
  if (!raw) return fallback;
  const decoded = decodeState(raw);
  if (!decoded) return fallback;
  return { ...fallback, ...decoded, registros_p3: { ...fallback.registros_p3, ...(decoded.registros_p3 || {}) } };
}

const REDUCE_MOTION = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const DUR = {
  snap: REDUCE_MOTION ? 1 : 250,
  back: REDUCE_MOTION ? 1 : 300,
  binRotate: REDUCE_MOTION ? 1 : 400,
  typewriter: REDUCE_MOTION ? 0 : 30,
};

function shuffleOrder(order) {
  let arr = order.slice();
  for (let attempt = 0; attempt < 10; attempt++) {
    arr = order.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    if (arr.every((c, i) => c !== order[i])) break;
  }
  return arr;
}

function useAudio(muted) {
  const ctxRef = useRef(null);
  const ensureCtx = useCallback(() => {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctxRef.current = new AC();
    }
    if (ctxRef.current && ctxRef.current.state === 'suspended') ctxRef.current.resume();
    return ctxRef.current;
  }, []);
  const playTone = useCallback((freqStart, freqEnd, durMs, type) => {
    if (muted) return;
    const ctx = ensureCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    const t0 = ctx.currentTime;
    osc.frequency.setValueAtTime(freqStart, t0);
    if (freqEnd !== freqStart) osc.frequency.linearRampToValueAtTime(freqEnd, t0 + durMs / 1000);
    gain.gain.setValueAtTime(0.16, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + durMs / 1000);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + durMs / 1000 + 0.03);
  }, [muted, ensureCtx]);
  const playCorrect = useCallback(() => playTone(440, 660, 120, 'sine'), [playTone]);
  const playIncorrect = useCallback(() => playTone(180, 180, 200, 'square'), [playTone]);
  return { playCorrect, playIncorrect, ensureCtx };
}

function onKeyActivate(fn) {
  return function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      fn();
    }
  };
}

/* ---------------------------------------------------------------------- */
/* 2. COMPONENTES DE PRESENTACIÓN                                         */
/* ---------------------------------------------------------------------- */

function FragmentFace({ frag }) {
  return React.createElement('div', {
    className: 'frag-thumb w-full h-full',
    style: { backgroundImage: `url(${frag.src})`, backgroundSize: frag.bgSize, backgroundPosition: frag.bgPos },
  });
}

function ConsoleHeader({ muted, onToggleMute, highContrast, onToggleContrast, equipo }) {
  return React.createElement('div', { className: 'flex flex-wrap items-center justify-between gap-3 px-4 sm:px-6 py-3 border-b hairline bg-[var(--bg-panel)]/90 backdrop-blur sticky top-0 z-40' },
    React.createElement('div', { className: 'flex items-center gap-3 flex-wrap' },
      React.createElement('span', { className: 'mono t-body font-semibold text-[var(--ocre)] border border-[var(--ocre-dim)] px-2 py-1' }, 'EONESIA v15.1'),
      React.createElement('h1', { className: 'mono t-title text-[var(--text-main)]' }, SYS_TITLE),
    ),
    React.createElement('div', { className: 'flex items-center gap-3 flex-wrap' },
      React.createElement('span', { className: 'mono t-body text-[var(--text-dim)] hidden sm:inline' }, equipo),
      React.createElement('button', {
        onClick: onToggleContrast,
        className: 'mono t-body px-3 py-2 border hairline scanline-btn',
        'aria-pressed': highContrast,
      }, highContrast ? '◐ contraste alto: ON' : '◐ alto contraste'),
      React.createElement('button', {
        onClick: onToggleMute,
        className: 'mono t-body px-3 py-2 border hairline scanline-btn',
        'aria-pressed': muted,
        'aria-label': muted ? 'Activar sonido' : 'Silenciar sonido',
      }, muted ? '🔇 sonido' : '🔊 sonido')
    )
  );
}

function PhaseTracker({ phase }) {
  const steps = [
    { n: 1, label: 'Identificar' },
    { n: 2, label: 'Aplicar' },
    { n: 3, label: 'Criterio' },
  ];
  return React.createElement('div', { className: 'flex items-center gap-3 flex-wrap mono t-label text-[var(--text-dim)] px-4 sm:px-6 py-3 border-b hairline' },
    steps.map((s, i) => React.createElement(React.Fragment, { key: s.n },
      React.createElement('span', {
        className: 'px-2 py-1 border ' + (phase === s.n ? 'text-[var(--gold)] border-[var(--gold)]/70 bg-[var(--gold)]/10' : 'border-transparent'),
      }, `FASE ${s.n} · ${s.label}`),
      i < steps.length - 1 ? React.createElement('span', { className: 'text-[var(--text-dim)]', 'aria-hidden': 'true' }, '—') : null
    ))
  );
}

function DossierPanel({ open, onClose }) {
  if (!open) return null;
  return React.createElement('div', { className: 'fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4', onClick: onClose },
    React.createElement('div', {
      className: 'bg-[var(--bg-panel)] border hairline max-w-xl w-full p-6',
      onClick: e => e.stopPropagation(),
      role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Dossier de elementos',
    },
      React.createElement('div', { className: 'flex items-center justify-between mb-4' },
        React.createElement('h2', { className: 'mono t-label text-[var(--gold)]' }, 'DOSSIER DE ELEMENTOS'),
        React.createElement('button', { onClick: onClose, className: 'mono t-body px-2 py-1 text-[var(--text-dim)] hover:text-[var(--text-main)]' }, '✕ cerrar')
      ),
      React.createElement('table', { className: 'w-full' },
        React.createElement('tbody', null,
          CATEGORY_ORDER_DEFAULT.map(key => React.createElement('tr', { key, className: 'border-t hairline align-top' },
            React.createElement('td', { className: 'py-3 pr-4 mono t-label text-[var(--gold)] w-32' }, CATEGORIES[key].label),
            React.createElement('td', { className: 'py-3 t-body text-[var(--text-dim)]' }, CATEGORIES[key].desc)
          ))
        )
      )
    )
  );
}

function HintBar({ text, onDismiss }) {
  if (!text) return null;
  return React.createElement('div', { className: 'fixed bottom-4 left-4 right-4 sm:right-auto sm:max-w-lg z-40', role: 'status' },
    React.createElement('div', { className: 'bg-[var(--bg-panel-2)] border border-[var(--ocre-dim)] px-4 py-3 flex items-start gap-3 shadow-lg' },
      React.createElement('span', { 'aria-hidden': 'true', className: 't-label' }, '💡'),
      React.createElement('p', { className: 'mono t-body text-[var(--text-main)] flex-1' }, text),
      React.createElement('button', { onClick: onDismiss, className: 'mono t-body px-2 text-[var(--text-dim)] hover:text-[var(--text-main)]', 'aria-label': 'Cerrar pista' }, '✕')
    )
  );
}

function CreditsLegend({ title, items }) {
  return React.createElement('div', { className: 'border hairline bg-[var(--bg-panel)] p-4' },
    React.createElement('p', { className: 'mono t-body font-semibold text-[var(--text-dim)] mb-2' }, title),
    React.createElement('ul', { className: 't-body text-[var(--text-dim)] space-y-1' },
      items.map((c, i) => React.createElement('li', { key: i }, c))
    )
  );
}

/* ---------------------------------------------------------------------- */
/* 3. APP PRINCIPAL                                                       */
/* ---------------------------------------------------------------------- */

function App() {
  const initial = useMemo(readInitialState, []);
  const [equipo] = useState(initial.equipo);
  const [ayudasUsadas, setAyudasUsadas] = useState(initial.ayudas_usadas || 0);
  const [muted, setMuted] = useState(false);
  const [highContrast, setHighContrast] = useState(false);
  const audio = useAudio(muted);

  useEffect(() => {
    document.documentElement.classList.toggle('hc', highContrast);
  }, [highContrast]);

  const [introDone, setIntroDone] = useState(false);
  const [phase, setPhase] = useState(1);
  const [dossierOpen, setDossierOpen] = useState(false);
  const [hint, setHint] = useState(null);

  /* ---------------- FASE 1: identificar ---------------- */
  const [fragments, setFragments] = useState(() => FRAGMENTS.map(f => ({ ...f, classified: false })));
  const [binOrder, setBinOrder] = useState(CATEGORY_ORDER_DEFAULT.slice());
  const [prevBinOrder, setPrevBinOrder] = useState(CATEGORY_ORDER_DEFAULT.slice());
  const [classifiedSinceRotation, setClassifiedSinceRotation] = useState(0);
  const [rotationThreshold, setRotationThreshold] = useState(() => 4 + Math.round(Math.random()));
  const [selectedFragId, setSelectedFragId] = useState(null);

  const binRefs = useRef({});

      if (!el) continue;
      const r = el.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return cat;
    }
    return null;
  }

  function triggerBinRotation() {
    const oldOrder = binOrder.slice();

    oldOrder.forEach(cat => {

      if (el) oldRects[cat] = el.getBoundingClientRect();

    setPrevBinOrder(oldOrder);
    setBinOrder(newOrder);
    requestAnimationFrame(() => {
      newOrder.forEach(cat => {
        const el = binRefs.current[cat];
        if (!el || !oldRects[cat]) return;
        const newRect = el.getBoundingClientRect();
        const delta = oldRects[cat].left - newRect.left;
        if (Math.abs(delta) > 0.5) {
